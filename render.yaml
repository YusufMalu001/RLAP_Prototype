services:
  - type: web
    name: rlap-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: corepack enable && corepack prepare pnpm@9.12.0 --activate && pnpm install --frozen-lockfile && pnpm --filter @rlap/db exec prisma generate
    startCommand: pnpm --filter api run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: COOKIE_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
    autoDeploy: true
